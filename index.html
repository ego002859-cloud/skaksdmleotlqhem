<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 · 일정 탭</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{--bg:#07090d;--panel:#10131a;--panel2:#151923;--line:#242a36;--text:#f5f7fb;--muted:#8992a4;--blue:#5da9ff;--red:#ff6b76;--lime:#c8ff3d;
--c-개인:#5da9ff;--c-신부장:#63d69c;--c-최고집:#ffb35c;--c-루프킹:#ff8fa3;--c-가온파:#4fd1c5;--c-문화부:#b590ff;--c-운동:#c8ff3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.sb{background:#080a0f;border-right:1px solid #1d2129;padding:14px 8px}
.sb b{display:block;padding:4px 10px 14px;font-size:14px}
.sb .lb{color:#424957;font-size:9px;font-weight:700;letter-spacing:.1em;padding:10px 10px 5px}
.sb .it{padding:8px 10px;border-radius:8px;color:#747d8b}.sb .it.on{background:#1a1d23;color:#fff;font-weight:600}
.sb .it small{color:#5f6775;font-weight:400;margin-left:4px}
.wrap{padding:22px clamp(14px,2.5vw,40px) 60px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
h1{font-size:22px}.top p{color:var(--muted);font-size:12px;margin-top:3px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#06101f;font-weight:600}
.q{margin:14px 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;width:210px}
.seg button{border:0;background:none;padding:6px 0;border-radius:7px;color:var(--muted);cursor:pointer}
.seg button.on{background:#1f2533;color:#fff;font-weight:600}
.nav{display:flex;gap:4px;align-items:center}.nav b{min-width:96px;text-align:center}
.ai{display:flex;gap:10px;align-items:center;background:#0e1a2b;border:1px solid #1f3a5c;border-radius:12px;padding:10px 12px;margin-bottom:10px;line-height:1.5}
.ai .ic{font-size:15px}.ai div{flex:1;min-width:0}.ai em{color:var(--blue);font-style:normal;font-weight:600}
.ai.warn{background:#2a1015;border-color:#5c1f29}.ai.warn em{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.sum small{color:var(--muted);font-size:11px;display:block}.sum b{font-size:17px}
/* 하루 */
.tl{position:relative;margin-left:38px;border-left:1px solid var(--line)}
.hr{position:absolute;left:-38px;width:calc(100% + 38px);border-top:1px solid #171b24;font-size:10px;color:#5f6775;padding-left:2px}
.now{position:absolute;left:-4px;right:0;border-top:2px solid var(--red);z-index:3}.now:before{content:'';position:absolute;left:-3px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.ev{position:absolute;border-radius:8px;padding:4px 8px;font-size:12px;overflow:hidden;background:color-mix(in srgb,var(--cc) 18%,#10131a);border-left:3px solid var(--cc);cursor:grab;z-index:2}
.ev small{color:var(--muted);margin-right:5px}
.ev.new{animation:pop .5s}@keyframes pop{from{transform:scale(.9);opacity:0}}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:#3a1219;color:var(--red);margin-left:4px;font-weight:600}
.free{position:absolute;left:4px;right:4px;border:1px dashed #33507a;border-radius:8px;color:#7fa9dc;font-size:12px;padding:4px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer;z-index:1}
.free:hover{background:#0e1a2b}
.td{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.td>span{color:var(--muted);font-size:12px;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:4px 10px;font-size:12px}
.chip.late{border-color:#5c1f29;color:#ffb3ba}
/* 주 */
.wr{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:10px 4px;border-bottom:1px solid #1a1f29;cursor:pointer}
.wr:last-child{border:0}.wr:hover{background:#12161f}
.wr .d b{font-size:16px;display:block}.wr .d{color:var(--muted);font-size:11px}.wr.today .d{color:var(--blue)}
.load{height:5px;border-radius:3px;background:#1a1f29;margin:4px 0 6px;overflow:hidden}.load i{display:block;height:100%;border-radius:3px}
.wi{display:flex;flex-wrap:wrap;gap:5px}
.wi span{font-size:12px;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--cc) 16%,#10131a);border-left:2px solid var(--cc)}
.wr .h{float:right;color:var(--muted);font-size:11px}
/* 월 */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;color:var(--muted);font-size:11px;padding-bottom:3px}
.mc{min-height:82px;border-radius:9px;padding:5px;border:1px solid transparent;cursor:pointer;min-width:0}
.mc:hover{border-color:var(--line)}.mc.other{opacity:.3}.mc.today{border-color:var(--blue)}
.mc .n{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.mc .n i{font-style:normal;color:#ffb3ba;font-size:10px}
.mc .m{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;border-left:2px solid var(--cc);padding-left:4px}
.mc .dots{display:none;gap:2px;margin-top:4px;flex-wrap:wrap}.mc .dots i{width:5px;height:5px;border-radius:50%;background:var(--cc)}
.lg{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px;margin-top:10px;flex-wrap:wrap}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;--H:clamp(480px,72vh,820px)}
.split>.card{height:var(--H);display:flex;flex-direction:column;min-height:0}
.mcard{container-type:inline-size}.mcard .mg{flex:1;min-height:0}
.mcard .mc{min-height:0;overflow:hidden}.mcard .mc .m,.mcard .mc .n i{display:none}.mcard .mc .dots{display:flex}
@container (min-width:440px){.mcard .mc .m{display:block}.mcard .mc .n i{display:inline}.mcard .mc .dots{display:none}}
.dscroll{flex:1;min-height:0;overflow:auto;padding:6px 2px 6px 0}
/* 시간 없는 할 일 */
.tdc{margin-top:12px}.tdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.tdh b{font-size:14px}.tdh small{color:var(--muted);font-size:11px}
.tdg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:4px 16px}
.tdg h4{font-size:12px;color:var(--muted);padding:4px 6px;display:flex;justify-content:space-between}.tdg .late h4{color:#ffb3ba}
.tr{display:flex;align-items:center;gap:8px;padding:8px 6px;border-top:1px solid #1a1f29}
.tr .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .dot{width:7px;height:7px;border-radius:50%;background:var(--cc);flex-shrink:0}
.tr small{color:var(--muted);font-size:11px;white-space:nowrap}.tr .put{padding:3px 8px;font-size:11px}
.tr.done{opacity:.4}.tr.done .tt{text-decoration:line-through}.tr .cb{margin:0}
.emp{color:#5f6775;font-size:12px;padding:8px 6px;border-top:1px solid #1a1f29}
.ais{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:0 10px}
.mc.sel{border-color:#fff;border-width:1.5px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.mh b{font-size:14px}.mh .btn{padding:3px 9px}
.dh{font-size:14px;font-weight:700;margin-bottom:8px}.dh em{font-style:normal;color:var(--blue);font-size:11px;margin-left:6px}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}.split>.mcard{height:auto}.mcard .mc{min-height:46px}}
.cb{width:15px;height:15px;accent-color:var(--blue);vertical-align:-3px;margin-right:6px;cursor:pointer}
.ev.done{opacity:.4}.ev.done,.chip.done span{text-decoration:line-through}
#st{font-size:11px;color:var(--muted);margin-right:8px}#st.wait{color:#ffb35c}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2533;border:1px solid var(--line);padding:9px 14px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:700px){
 .app{grid-template-columns:minmax(0,1fr)}.sb{display:none}.wrap{padding:16px 14px 60px}
 .bar{flex-wrap:wrap}.seg{width:100%}.nav{width:100%;justify-content:space-between}
 .mc{min-height:46px}.mc .m,.mc .n i{display:none}.mc .dots{display:flex}
 .sum b{font-size:15px}
}
</style></head><body>
<div class="app">
<aside class="sb"><b>MY OS</b>
 <div class="lb">전체</div><div class="it on">📅 일정 <small>오늘·주·월</small></div>
 <div class="lb">관리</div><div class="it">노트</div><div class="it">편집</div>
 <div class="lb">사업 · 사명</div><div class="it">사업</div><div class="it">운동</div>
</aside>
<main class="wrap">
 <div class="top"><div><h1>일정</h1><p id="sub"></p></div><div><span id="st">연결됨</span><button class="btn">브리핑</button></div></div>
 <input class="q" placeholder="내일 3시 촬영 미팅 1시간 — 한 줄로 치고 엔터">
 <div class="bar">
  <div class="seg"><button data-v="d">월 + 하루</button><button data-v="w">주</button></div>
  <div class="nav"><button class="btn" onclick="mv(-1)">‹</button><b id="lbl"></b><button class="btn" onclick="mv(1)">›</button><button class="btn" onclick="cur=new Date(T);draw()">오늘</button></div>
 </div>
 <div id="ai"></div>
 <div id="view"></div>
</main></div>
<div class="toast" id="toast"></div>
<script>
// ── 시안용 가짜 데이터(오늘 기준 상대 날짜) ──
const T=new Date();T.setHours(0,0,0,0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DOW='일월화수목금토';
const m2t=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const t2m=t=>+t.slice(0,2)*60+ +t.slice(3);
let E=[ // 일정: d=오늘부터 며칠, s=시작, dur=분
 [0,'10:00',90,'문화부 주간 회의','문화부'],[0,'11:30',60,'신부장 릴스 촬영','신부장'],[0,'12:00',60,'점심 · 구역장','개인'],
 [0,'16:00',60,'운동 · 하체','운동'],[0,'19:30',90,'최고집 컷편집','최고집'],
 [1,'09:30',60,'가온파 현장 통화','가온파'],[1,'14:00',120,'루프킹 촬영','루프킹'],[1,'16:00',60,'운동 · 상체','운동'],
 [2,'10:00',60,'주간 편집회의','최고집'],[2,'13:00',240,'가온파 본편 편집','가온파'],[2,'18:00',180,'신부장 고객 미팅','신부장'],
 [3,'16:00',60,'운동 · 하체','운동'],[4,'11:00',60,'치과','개인'],[5,'10:00',120,'문화부 리허설','문화부'],[6,'11:00',120,'예배','문화부'],
 [-5,'10:00',60,'주간 편집회의','최고집'],[-12,'10:00',60,'주간 편집회의','최고집'],[-19,'10:00',60,'주간 편집회의','최고집'],
 [-2,'09:00',540,'촬영 데이','루프킹'],[-1,'13:00',180,'최고집 촬영','최고집'],[8,'09:00',600,'총회 행사','문화부'],[9,'10:00',300,'가온파 촬영','가온파'],
 [12,'14:00',60,'운동','운동'],[15,'10:00',120,'문화부 회의','문화부'],[-8,'10:00',240,'편집','가온파'],[-3,'15:00',60,'운동','운동']
].map(([d,s,dur,title,cat],i)=>({id:i,due:iso(add(T,d)),s,dur,title,cat}));
let TODO=[{id:'a',title:'편집 마감 · 루프킹 2편',dur:90,cat:'루프킹',late:1},{id:'b',title:'세금계산서 발행',dur:30,cat:'개인',late:1},
 {id:'d',title:'신부장 견적서 정리',dur:30,cat:'신부장',due:iso(add(T,1))},{id:'c',title:'썸네일 시안',dur:60,cat:'최고집',due:iso(add(T,2))},{id:'f',title:'가온파 자막 검수',dur:60,cat:'가온파',due:iso(add(T,3))},
 {id:'e',title:'운동 사진 정리',dur:30,cat:'운동'},{id:'g',title:'책장 정리',dur:60,cat:'개인'}];
let view='d', cur=new Date(T), repDone=false;
const HPX=46, H0=9, H1=24;
const onDay=ds=>E.filter(e=>e.due===ds).sort((a,b)=>a.s<b.s?-1:1);
const hours=ds=>onDay(ds).reduce((a,e)=>a+e.dur,0)/60;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

// 겹침 → 같은 그룹 안에서 칸 나누기
function lanes(evs){
 const out=[];let grp=[],end=0;
 const flush=()=>{const cols=[];grp.forEach(e=>{let c=cols.findIndex(x=>x<=t2m(e.s));if(c<0){c=cols.length;cols.push(0)}cols[c]=t2m(e.s)+e.dur;e._c=c});grp.forEach(e=>{e._n=cols.length;e._x=grp.length>1;out.push(e)});grp=[]};
 evs.forEach(e=>{if(grp.length&&t2m(e.s)>=end){flush();end=0}grp.push(e);end=Math.max(end,t2m(e.s)+e.dur)});flush();return out;
}
// 빈 시간(60분 이상) — 오늘은 지금 이후만
function frees(ds){
 const now=new Date(),isT=ds===iso(T);let p=Math.max(H0*60,isT?Math.ceil((now.getHours()*60+now.getMinutes())/30)*30:0);const out=[];
 onDay(ds).forEach(e=>{const s=t2m(e.s);if(s-p>=60)out.push([p,s]);p=Math.max(p,s+e.dur)});
 if(H1*60-60-p>=60)out.push([p,H1*60-60]);return out;
}
function fill(){ // 밀린 할 일 → 빈 칸에 자동 배치
 const ds=iso(cur);let n=0;
 TODO.filter(t=>t.late).forEach(t=>{const f=frees(ds).find(([a,b])=>b-a>=t.dur);if(!f)return;E.push({id:Date.now()+n,due:ds,s:m2t(f[0]),dur:t.dur,title:t.title,cat:t.cat,isNew:1});t.done=1;n++});
 TODO=TODO.filter(t=>!t.done);toast(`${n}개를 빈 칸에 넣었어요 · 끌어서 옮길 수 있어요`);draw();
}
function put(a,i){const t=TODO[i];E.push({id:Date.now(),due:iso(cur),s:m2t(a),dur:t.dur,title:t.title,cat:t.cat,isNew:1});TODO.splice(i,1);toast(`'${t.title}' 넣음`);draw()}

function aiBox(){
 const ds=iso(cur),el=document.getElementById('ai');
 if(view==='d'){
  const evs=onDay(ds),plan=hours(ds),free=frees(ds).reduce((a,[x,y])=>a+y-x,0)/60,late=TODO.filter(t=>t.late);
  const over=lanes(evs.map(e=>({...e}))).filter(e=>e._x);
  let h='';
  if(late.length&&ds===iso(T))h+=`<div class="ai"><span class="ic">✨</span><div>밀린 할 일 <em>${late.length}개</em>(${late.reduce((a,t)=>a+t.dur,0)}분) — 오늘 빈 칸에 넣을까요?</div><button class="btn pri" onclick="fill()">넣기</button></div>`;
  if(over.length)h+=`<div class="ai warn"><span class="ic">⚠️</span><div><em>겹침</em> ${[...new Set(over.map(e=>e.title))].join(' ↔ ')} — 하나를 끌어서 옮기세요</div></div>`;
  if(!repDone)h+=`<div class="ai"><span class="ic">🔁</span><div>'<em>주간 편집회의</em>'를 4주째 같은 요일 10시에 — 매주 반복으로 만들까요?</div><button class="btn pri" onclick="repDone=true;toast('매주 반복으로 바꿨어요');draw()">매주로</button></div>`;
  el.innerHTML=`<div class="ais">${h}</div><div class="sum"><div><small>계획</small><b>${plan.toFixed(1)}시간</b></div><div><small>빈 시간</small><b style="color:var(--blue)">${free.toFixed(1)}시간</b></div><div><small>남은 일정</small><b>${evs.length}개</b></div></div>`;
 }else if(view==='w'){
  const days=[...Array(7)].map((_,i)=>iso(add(wkStart(),i))),hv=days.map(hours),mx=Math.max(...hv),lt=Math.min(...hv);
  el.innerHTML=`<div class="ai"><span class="ic">✨</span><div>이번 주 <em>${hv.reduce((a,b)=>a+b,0).toFixed(0)}시간</em> · 가장 바쁜 날 <em>${fmt(days[hv.indexOf(mx)])}</em>(${mx.toFixed(1)}h) · 여유 있는 날 <em>${fmt(days[hv.indexOf(lt)])}</em> — 새 일은 여유 있는 날로</div></div>`;
 }else{
  el.innerHTML=repDone?'':`<div class="ai"><span class="ic">🔁</span><div>'<em>주간 편집회의</em>'를 4주째 같은 요일 10시에 넣으셨어요. 매주 반복으로 만들까요?</div><button class="btn pri" onclick="repDone=true;toast('매주 반복으로 바꿨어요');draw()">매주로</button></div>`;
 }
}
const fmt=ds=>{const d=new Date(ds+'T00:00');return`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
const wkStart=()=>add(cur,-cur.getDay());

function dayV(){
 const ds=iso(cur),evs=lanes(onDay(ds).map(e=>({...e})));
 let h=`<div class="card"><div class="dh">${fmt(ds)}${ds===iso(T)?'<em>오늘</em>':''}</div><div class="dscroll"><div class="tl" style="height:${(H1-H0)*HPX}px">`;
 for(let i=H0;i<H1;i++)h+=`<div class="hr" style="top:${(i-H0)*HPX}px">${i}</div>`;
 frees(ds).forEach(([a,b])=>{const t=TODO.findIndex(x=>x.dur<=b-a);h+=`<div class="free" style="top:${(a/60-H0)*HPX+2}px;height:${(b-a)/60*HPX-4}px" ${t>=0?`onclick="put(${a},${t})"`:''}><span>${m2t(a)}~${m2t(b)} 비어 있음 ${(b-a)/60}시간</span>${t>=0?`<b>+ ${TODO[t].title}</b>`:''}</div>`});
 evs.forEach(e=>{const top=(t2m(e.s)/60-H0)*HPX,w=100/e._n;h+=`<div class="ev${e.isNew?' new':''}${e.done?' done':''}" style="--cc:var(--c-${e.cat});top:${top+1}px;height:${e.dur/60*HPX-2}px;left:calc(${e._c*w}% + 4px);width:calc(${w}% - 8px)"><input type="checkbox" class="cb" ${e.done?'checked':''} onchange="ck(this,${e.id})"><small>${e.s}</small>${e.title}${e._x?'<span class="tag">겹침</span>':''}</div>`});
 if(ds===iso(T)){const n=new Date(),m=n.getHours()*60+n.getMinutes();if(m>H0*60&&m<H1*60)h+=`<div class="now" style="top:${(m/60-H0)*HPX}px"></div>`}
 h+=`</div></div></div>`;
 return h;
}
// 시간 없는 할 일: 밀림 / 마감 있음 / 언젠가 세 묶음
function todoV(){
 const G=[['late','밀림',t=>t.late],['week','마감 있음',t=>!t.late&&t.due],['some','언젠가',t=>!t.late&&!t.due]];
 const row=t=>`<div class="tr${t.done?' done':''}" style="--cc:var(--c-${t.cat})"><input type="checkbox" class="cb" ${t.done?'checked':''} onchange="ck(this,'${t.id}')"><i class="dot"></i><span class="tt">${t.title}</span><small>${t.due?fmt(t.due)+' · ':''}${t.dur}분</small><button class="btn put" onclick="putT('${t.id}')">+ 빈 칸</button></div>`;
 return `<div class="card tdc"><div class="tdh"><b>시간 없는 할 일 <small>${TODO.length}개 · ${TODO.reduce((a,t)=>a+t.dur,0)}분</small></b><small>「+ 빈 칸」 = 위 하루의 첫 빈 시간에 넣기</small></div><div class="tdg">`
  +G.map(([k,n,f])=>{const ts=TODO.filter(f);return `<div class="${k}"><h4>${n}<span>${ts.length}</span></h4>${ts.map(row).join('')||'<div class="emp">없음</div>'}</div>`}).join('')+'</div></div>';
}
function putT(id){const i=TODO.findIndex(t=>t.id===id),t=TODO[i],f=frees(iso(cur)).find(([a,b])=>b-a>=t.dur);if(!f)return toast(`${fmt(iso(cur))}엔 ${t.dur}분 빈 칸이 없어요`);put(f[0],i)}
function weekV(){
 return '<div class="card">'+[...Array(7)].map((_,i)=>{const d=add(wkStart(),i),ds=iso(d),hv=hours(ds),c=hv>8?'var(--red)':hv>5?'#ffb35c':'var(--blue)';
  return`<div class="wr${ds===iso(T)?' today':''}" onclick="cur=new Date('${ds}T00:00');setV('d')"><div class="d"><b>${d.getDate()}</b>${DOW[d.getDay()]}요일</div><div><span class="h">${hv?hv.toFixed(1)+'시간':'비어 있음'}</span><div class="load"><i style="width:${Math.min(100,hv/10*100)}%;background:${c}"></i></div><div class="wi">${onDay(ds).map(e=>`<span style="--cc:var(--c-${e.cat})">${e.s} ${e.title}</span>`).join('')}</div></div></div>`}).join('')+'</div>';
}
function monthV(){
 const f=new Date(cur.getFullYear(),cur.getMonth(),1),st=add(f,-f.getDay()),wk=Math.ceil((f.getDay()+new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate())/7);
 let h=`<div class="card mcard"><div class="mh"><button class="btn" onclick="mvM(-1)">‹</button><b>${cur.getFullYear()}년 ${cur.getMonth()+1}월</b><button class="btn" onclick="mvM(1)">›</button></div><div class="mg" style="grid-template-rows:auto repeat(${wk},minmax(0,1fr))">`+[...DOW].map(d=>`<div class="dow">${d}</div>`).join('');
 for(let i=0;i<wk*7;i++){const d=add(st,i),ds=iso(d),hv=hours(ds),ev=onDay(ds);
  const bg=hv>8?'#3a1219':hv>=5?'#16304f':hv>=2?'#122238':hv>0?'#0e1828':'transparent';
  h+=`<div class="mc${d.getMonth()!==cur.getMonth()?' other':''}${ds===iso(T)?' today':''}${ds===iso(cur)?' sel':''}" style="background:${bg}" onclick="cur=new Date('${ds}T00:00');draw()"><div class="n">${d.getDate()}${hv>8?'<i>과부하</i>':''}</div>${ev.slice(0,2).map(e=>`<div class="m" style="--cc:var(--c-${e.cat})">${e.title}</div>`).join('')}${ev.length>2?`<div class="m" style="--cc:transparent;color:var(--muted)">+${ev.length-2}</div>`:''}<div class="dots">${ev.map(e=>`<i style="--cc:var(--c-${e.cat})"></i>`).join('')}</div></div>`}
 return h+`</div><div class="lg">바쁜 정도 <i style="background:#0e1828"></i>~2h <i style="background:#122238"></i>~5h <i style="background:#16304f"></i>~8h <i style="background:#3a1219"></i>8h 넘음</div></div>`;
}
function draw(){
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 const d=cur;document.getElementById('sub').textContent=`${T.getMonth()+1}월 ${T.getDate()}일 ${DOW[T.getDay()]}요일 · 오늘·캘린더를 합친 탭`;
 document.getElementById('lbl').textContent=view==='d'?fmt(iso(d)):`${fmt(iso(wkStart()))} 주`;
 aiBox();document.getElementById('view').innerHTML=view==='d'?`<div class="split">${monthV()}${dayV()}</div>${todoV()}`:weekV();
 const sc=document.querySelector('.dscroll');if(sc){const f=onDay(iso(cur))[0],h=iso(cur)===iso(T)?new Date().getHours()-1:f?+f.s.slice(0,2):H0;sc.scrollTop=Math.max(0,(h-H0)*HPX)}
 E.forEach(e=>delete e.isNew);
}
function setV(v){view=v;draw()}
// 체크: 화면에 바로 표시, 서버 저장은 마지막 체크 2.5초 뒤 한꺼번에(그 사이 화면 다시 그리지 않음 → 연달아 체크 가능)
const wait={};let ckT=0;
function ck(el,id){const o=E.find(e=>e.id===id)||TODO.find(t=>t.id===id);o.done=el.checked;el.closest('.ev,.tr').classList.toggle('done',el.checked);wait[id]=1;
 const st=document.getElementById('st');st.className='wait';st.textContent=`저장 대기 ${Object.keys(wait).length}건`;
 clearTimeout(ckT);ckT=setTimeout(()=>{const n=Object.keys(wait).length;Object.keys(wait).forEach(k=>delete wait[k]);st.className='';st.textContent='연결됨 · 방금 저장';toast(`체크 ${n}건 한꺼번에 저장했어요`)},2500)}
function mv(n){cur=add(cur,view==='w'?7*n:n);draw()}
function mvM(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);draw()}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setV(b.dataset.v));
draw();
</script></body></html>
