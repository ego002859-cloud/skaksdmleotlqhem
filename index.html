<meta charset="utf-8">
<title>문화부 OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  /* 예전 녹색 팔레트(크림 바탕 · 진회색 · 라임 · 진한 녹색 히어로) — 레이아웃은 v2 유지 */
  --bg:#F2F1EC; --panel:#FFFFFF; --ink:#151B23; --dim:#6B7480; --faint:#9AA1AB;
  --line:#E5E2D8; --track:#EDECE3; --accent:#131A22; --accent-ink:#92FF00; --accent-bg:#F1F8DF;
  --hero:#1F5C3B; --hero2:#27704A; --hero-ink:#F3F8F2; --hero-dim:#B9D6C4; --mint:#92FF00; --glow:#92FF00;
  --red:#DE3B30; --red-bg:#FBEAE8; --ok:#3F7A14; --ok-bg:#EAF3DC; --amber:#9A6A00; --amber-bg:#F7EFD9;
  --k-통합:#2F6FED; --k-통합-bg:#E7EEFD; --k-월간:#1D9E75; --k-월간-bg:#E3F4EE; --k-외부:#E0672B; --k-외부-bg:#FCEBE2; --k-상시:#6B7480; --k-상시-bg:#EEF1F5;
  --seg:#FFFFFF; --seg-ink:#3C444E; --input:#FAFAF6; --cb:#C7CDD4; --chipcat:#EEF1F5; --chipcat-ink:#465060;
  --shadow:0 10px 30px rgba(60,55,30,.08); --shadow-sm:0 2px 8px rgba(60,55,30,.07); --r:24px;
  --dark:#131A22; --lime:#92FF00; --daily:#1F5C3B;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:'Manrope','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.55}
.mono{font-family:'Manrope','Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 90px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

header.top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 14px;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;font-size:15px}
.brand span:first-child{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.brand small{font-weight:600;color:var(--dim);font-size:11px;letter-spacing:.06em}
.userchip{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:6px 6px 6px 12px;font-size:12px;min-width:0;box-shadow:var(--shadow-sm)}
.userchip:empty{display:none}
.userchip b{font-weight:800;white-space:nowrap}
.userchip .g{display:inline-flex;align-items:center;gap:4px;color:var(--dim);white-space:nowrap}
.userchip .g i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.userchip select{border:none;background:var(--track);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--dim);max-width:120px}
.hbtn{width:30px;height:30px;border-radius:50%;background:var(--panel);color:var(--dim);font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow-sm)}
.hbtn.on{background:var(--accent)}
.sw{background:var(--track);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--dim)}

.seg{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 14px}
.seg-in{display:flex;gap:4px;background:var(--seg);border-radius:999px;padding:5px;box-shadow:var(--shadow-sm)}
.seg-in button{flex:1;min-height:38px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--seg-ink)}
.seg-in button.on{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--panel);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.meet{box-shadow:var(--shadow),0 0 0 2px var(--accent-bg)}
.kicker{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin-bottom:4px}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-size:11.5px;font-weight:600;color:var(--dim)}
.card h3{font-size:12px;font-weight:800;color:var(--dim);margin:14px 0 6px}

/* ── 히어로(일일보고): 어두운 카드 + 큰 숫자 ── */
.card.daily{background:linear-gradient(135deg,var(--hero),var(--hero2));color:var(--hero-ink);box-shadow:0 18px 40px rgba(31,92,59,.28)}
.card.daily .kicker{color:var(--glow)}
.card.daily h2{color:#fff}
.card.daily h2 .sub{color:var(--hero-dim)}
.card.daily .hint{color:var(--hero-dim)}
.stats{display:flex;gap:22px;margin:4px 0 14px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em;color:#fff;text-shadow:0 0 18px rgba(146,255,0,.25)}
.stat b small{font-size:13px;font-weight:700;color:var(--hero-dim);margin-left:2px}
.stat span{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-dim)}
.card.daily .tog{background:rgba(255,255,255,.10)}
.card.daily .tog button{color:var(--hero-dim)}
.card.daily .tog button.on{background:var(--lime);color:#131A22;box-shadow:none}
.card.daily .form select,.card.daily .form input[type=text]{background:#fff;border-color:transparent;color:#1E2235}
.card.daily .btn.pri{background:var(--lime);color:#131A22;box-shadow:none}
.card.daily .rep{border-top-color:rgba(255,255,255,.10)}
.card.daily .rep .who{color:var(--hero-dim)}
.card.daily .rep .auto{color:#C9CFE6}
.card.daily .rep .del{background:rgba(255,255,255,.12);color:var(--hero-dim)}
.card.daily .rep .del:hover{color:#fff}
.card.daily .wk i{background:rgba(255,255,255,.14)}
.card.daily .wk i.f{background:var(--lime);box-shadow:0 0 10px rgba(146,255,0,.45)}
.card.daily .wk i.today{box-shadow:0 0 0 1.5px var(--glow)}
.card.daily .err{color:#FFB3A8}
.card.daily .hq-row{border-top-color:rgba(255,255,255,.10);color:#fff;grid-template-columns:1fr 122px 112px}
.card.daily .hq-row .hq-name{display:grid;grid-template-columns:8px 5em 1fr;gap:8px;align-items:center}
.card.daily .hq-row .hq-name > span:nth-child(2){white-space:nowrap}
.card.daily .hq-row .wk{justify-self:start}
.card.daily .hq-row .chip{width:112px;text-align:center;justify-self:end}
.card.daily .hq-sub{color:var(--hero-dim)}
.card.daily .hq-row:hover{background:rgba(255,255,255,.04)}
@media (max-width:520px){.card.daily .hq-row{grid-template-columns:1fr auto;grid-template-areas:"name chip" "dots dots"}.card.daily .hq-row .hq-name{grid-area:name}.card.daily .hq-row .chip{grid-area:chip;width:auto}.card.daily .hq-row .wk{grid-area:dots}}

.tog{display:inline-flex;gap:2px;background:var(--track);border-radius:999px;padding:3px}
.tog button{font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;color:var(--dim)}
.tog button:disabled{color:var(--faint);cursor:default}
.tog button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ── 목표: 파스텔 행 + 아이콘 타일 ── */
.kind{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;color:var(--kc);background:var(--panel)}
.kind i{width:7px;height:7px;border-radius:50%;background:var(--kc)}
.goal{position:relative;padding:12px 14px 8px 14px;margin-top:10px;border-radius:18px;background:var(--kb)}
.goal:first-child{margin-top:0}
.goal .gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal .gh::before{content:'';width:10px;height:10px;border-radius:4px;background:var(--kc);flex:0 0 auto;box-shadow:0 2px 6px color-mix(in srgb,var(--kc) 45%,transparent)}
.goal .gh b{flex:1;min-width:0;font-weight:800;font-size:14px}
.goal .gh b.gt{cursor:pointer}
.goal .gh .pct{font-size:12px;font-weight:800;color:var(--kc);white-space:nowrap}
.goal .bar{margin-top:8px;height:6px;background:rgba(255,255,255,.7)}
.goal .bar i{background:var(--kc)}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge.dorm{background:var(--amber-bg);color:var(--amber)}
.badge.depts{background:var(--track);color:var(--dim);font-weight:600}
.pdepts{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px}
.pd{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--dim)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--panel);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow-sm)}
.tile .lb{font-size:10.5px;color:var(--dim);margin-bottom:2px;white-space:nowrap}
.tile .v{font-size:21px;font-weight:800;line-height:1.1}
.tile .v small{font-size:11px;color:var(--dim);margin-left:2px}
.tile .note{font-size:10.5px;color:var(--faint);margin-top:4px}

.bar{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.chip{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
.chip.bad{background:var(--red-bg);color:var(--red)}
.chip.cat{background:var(--chipcat);color:var(--chipcat-ink)}
.chip.goal{color:var(--kc);background:var(--kb)}
.dday{font-size:11px;font-weight:700}
.dday.hot{color:var(--red)}
.dday.cool{color:var(--dim)}

.task{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;margin-top:6px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow-sm)}
.task .cb{width:20px;height:20px;border:2px solid var(--cb);border-radius:50%;flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.task.done .cb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task .tt{flex:1;min-width:0}
.task .tt b{font-weight:700;display:block;font-size:13px}
.task.done .tt b{color:var(--faint);text-decoration:line-through}
.task .meta{font-size:11px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.task .src{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px;font-size:10px;font-weight:800}
.task .tt .ln{display:flex;align-items:center;gap:6px}
.task .tt .ln b{flex:1;min-width:0}
.task .tt .ln b.tl{cursor:pointer}
.task .tt .ln b.tl:hover{text-decoration:underline;text-decoration-color:var(--faint)}
.subs{margin-left:18px}
.subs .task{padding:6px 10px;box-shadow:none;background:var(--track)}
.subs .task .cb{width:16px;height:16px;font-size:9px;border-width:1.5px}
.subs .task .tt b{font-size:12.5px;font-weight:600}
.fold{font-size:11px;font-weight:700;color:var(--faint);padding:6px 0 4px 10px}
.fold:hover{color:var(--ink)}
.acts{display:inline-flex;gap:2px;margin-left:auto;flex:0 0 auto}
.act{font-size:10.5px;font-weight:700;color:var(--faint);padding:3px 7px;border-radius:8px;white-space:nowrap}
.act:hover{color:var(--ink);background:var(--track)}
.act.danger:hover{color:var(--red);background:var(--red-bg)}

.form .frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form .rrow{grid-template-columns:1fr minmax(140px,38%) auto;margin-bottom:4px}
@media (max-width:520px){.form .rrow{grid-template-columns:1fr auto}.form .rrow input{grid-column:1/-1}}
.form select,.form input[type=text],.form input[type=date]{width:100%;min-height:42px;background:var(--input);border:1px solid transparent;border-radius:12px;padding:8px 12px;font-size:13px}
.form input::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border-radius:12px;font-weight:800;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(19,26,34,.22)}
.btn.pri:active{transform:scale(.98)}
.btn.ghost{background:var(--track);color:var(--dim)}
.err{color:var(--red);font-size:12px;margin-top:6px;display:none}
.hint{font-size:11.5px;color:var(--faint);margin-top:8px}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}

.wk{display:flex;gap:4px}
.wk i{width:14px;height:14px;border-radius:5px;background:var(--track)}
.wk i.f{background:var(--accent)}
.wk i.today{box-shadow:0 0 0 1.5px var(--accent)}

.hql{margin-top:8px}
.hq-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hq-row:first-of-type{border-top:none}
.hq-name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.hq-sub{font-size:11px;color:var(--dim);font-weight:500}
.sig{display:flex;gap:10px;font-size:11px;color:var(--dim)}
.sig span{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:34px}
.sig b{font-weight:700;font-size:12.5px;color:var(--ink)}
.sig .lb{font-size:9.5px;letter-spacing:.04em}
.dsecs{margin-top:14px}
.dsec{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border-radius:16px;background:var(--track);font-size:13px}
.dsec b{font-weight:800}
.dsec.ksec{background:var(--kb)}
.dsec.ksec b{color:var(--kc)}
.dbody{padding:8px 0 6px}

.int-depts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.int-d{text-align:center;font-size:10px;font-weight:700;color:var(--dim)}
.int-d .bar{height:5px;margin-bottom:4px;background:rgba(255,255,255,.7)}
.bottleneck{margin-top:10px;font-size:12px;font-weight:700;background:var(--red-bg);color:var(--red);border-radius:12px;padding:8px 12px}
.dormant{font-size:12px;font-weight:700;background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:8px 12px;margin-top:8px}

.rep{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.rep:first-of-type{border-top:none}
.rep .who{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--dim);padding-top:2px;min-width:44px}
.rep .tx{flex:1;min-width:0}
.rep .auto{color:var(--dim)}
.rep .del{background:var(--track);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--dim)}
.rep .del:hover{color:var(--ink)}
.wkl{margin-top:8px}
.wd{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.10);font-size:12.5px}
.wd .wdd{font-size:11px;font-weight:800;color:var(--hero-dim);padding-top:2px}
.wd.today .wdd{color:var(--mint)}
.wd.future .wdd{color:#6C7390}
.wdl{display:flex;flex-direction:column;gap:3px;min-width:0}
.wdi{display:flex;align-items:flex-start;gap:6px;min-width:0}
.wdi i{width:7px;height:7px;border-radius:50%;background:var(--kc);flex:0 0 auto;margin-top:6px}
.wdi.none{color:#6C7390}
.day{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;color:var(--dim);margin:12px 0 0}
.day.today{color:var(--ink)}
.day.future{color:var(--faint)}
.day .n{font-weight:600;color:var(--faint)}
.grp{margin-top:6px}
.grp .gt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin:10px 0 2px}
.grp .gt .n{font-weight:600;color:var(--dim);font-size:11px}
.mdepts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
.mdepts button{min-height:36px;border-radius:999px;background:var(--panel);color:var(--dim);font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;padding:0 4px;box-shadow:var(--shadow-sm)}
.mdepts button.on{background:var(--accent);color:var(--accent-ink)}
.mdepts button .dot{width:7px;height:7px}
@media (max-width:420px){.mdepts{gap:4px}.mdepts button{font-size:10.5px;gap:4px;min-height:34px}}
.mt-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mt-head b{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.mt-head .sub{font-size:11px;color:var(--dim)}

/* 인라인 편집기 / 등록 폼 */
.ed{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;margin:6px 0 8px;padding:8px;background:var(--input);border-radius:12px}
.ed input,.ed select{min-height:36px;border:1px solid transparent;border-radius:9px;padding:5px 10px;font-size:12.5px;background:var(--panel)}
.ed input[type=date]{width:136px}
.ed .btn{min-height:36px;padding:0 12px;font-size:12px}
.ed.wide{grid-template-columns:auto auto 1fr auto auto auto}
.ed.wide select{max-width:120px}
@media (max-width:520px){.ed,.ed.wide{grid-template-columns:1fr 1fr}.ed input[type=text]{grid-column:1/-1}}
.addgoal{font-size:11.5px;font-weight:800;color:var(--ink);background:var(--accent-bg);border-radius:999px;padding:6px 12px}
.gform{background:var(--input);border-radius:18px;padding:14px;margin:6px 0 12px}
.gform .lb{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin:10px 0 5px}
.gform .lb:first-child{margin-top:0}
.gform .pills{display:flex;gap:6px;flex-wrap:wrap}
.gform .pill{font-size:12px;font-weight:800;padding:7px 13px;border-radius:999px;background:var(--panel);color:var(--dim);box-shadow:var(--shadow-sm)}
.gform .pill.on{background:var(--accent);color:var(--accent-ink)}
.gform .dch{display:flex;flex-wrap:wrap;gap:6px}
.gform .dch label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:12px;background:var(--panel);cursor:pointer;box-shadow:var(--shadow-sm)}
.gform .dch input{accent-color:var(--accent)}
.gform input[type=text],.gform input[type=date],.gform select{min-height:40px;border:1px solid transparent;border-radius:10px;padding:6px 11px;font-size:13px;background:var(--panel);width:100%}
.gform .acts2{display:flex;gap:8px;margin-top:12px}
.drow{display:grid;grid-template-columns:1fr 128px auto auto;gap:6px;align-items:center;margin-top:6px}
.drow.multi{grid-template-columns:110px 1fr 128px auto auto}
.drow.sub{margin-left:26px;grid-template-columns:1fr 128px auto;position:relative}
.drow.sub::before{content:'';position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.drow input,.drow select{min-height:36px!important;font-size:12.5px!important}
.drow .x{width:32px;height:36px;border-radius:9px;color:var(--faint);font-size:14px}
.drow .x:hover{color:var(--red);background:var(--red-bg)}
.drow .plus{height:36px;padding:0 10px;border-radius:9px;font-size:11.5px;font-weight:800;color:var(--dim);background:var(--panel);white-space:nowrap;box-shadow:var(--shadow-sm)}
.gform .addrow{margin-top:8px;font-size:12px;font-weight:800;color:var(--ink);background:var(--accent-bg);border-radius:999px;padding:7px 13px}
@media (max-width:560px){.drow,.drow.multi,.drow.sub{grid-template-columns:1fr 1fr auto}.drow input[type=text]{grid-column:1/-1}.drow.multi select{grid-column:1/2}}

/* 월간 보고서 */
.rp-nav{display:flex;align-items:center;gap:8px}
.rp-nav button{width:32px;height:32px;border-radius:10px;background:var(--track);color:var(--dim);font-weight:800}

.rp-sec{margin-top:16px}
.rp-sec h3{font-size:12.5px;font-weight:800;color:var(--dim);letter-spacing:.02em;margin:0 0 6px;display:flex;align-items:center;gap:8px}

.rp-goal{padding:10px 12px;border-radius:14px;background:var(--kb);margin-top:8px}

.rp-li.sub{padding-left:24px;color:var(--dim)}
.rp-li .m{flex:0 0 16px;font-weight:800;color:var(--faint)}
.rp-li.done .m{color:var(--ok)}
.rp-li .n{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.rp-li .who{font-size:11px;color:var(--faint);white-space:nowrap}
.rp-plain{padding:8px 12px;border-radius:14px;background:var(--track);margin-top:8px}
.rp-empty{font-size:12px;color:var(--faint);padding:6px 4px}

.rp-word .lb{font-size:12px;font-weight:800;color:var(--dim);margin:12px 0 4px}

.rp-fin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--dark);color:var(--panel);font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;z-index:50;box-shadow:var(--shadow)}

function weekKeys(){ const t=new Date(TODAY+'T00:00:00'); const mon=new Date(t); mon.setDate(t.getDate()-((t.getDay()+6)%7));

function api(action,payload){
  return new Promise((res,rej)=>{
    if(!LIVE){ res({ id:'x'+(++seq) }); return; }

/* 첫 화면: 공통 PIN → 이름 선택(첫 1회). 맞으면 이 기기에 기억 */

/* ───────── 계산 ───────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function goalById(id){ return GOALS.find(g=>g.id===id); }
function isMulti(g){ return g.kind!=='월간'; }
function goalDepts(g){ return isMulti(g) ? (g.depts||[]) : (g.dept?[g.dept]:[]); }
function tasksOf(g,dept){ return isMulti(g) && dept ? g.tasks.filter(t=>t.dept===dept) : g.tasks; }
function pct(ts){ return ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0; }
function deptGoals(dept,inclDone){ return GOALS.filter(g=>(inclDone||!g.done) && goalDepts(g).includes(dept)); }
function weekReports(dept){ const wk=weekKeys(); return REPORTS.filter(r=>(!dept||r.dept===dept)&&wk.includes(r.date)); }
function todayReports(dept){ return REPORTS.filter(r=>r.date===TODAY&&(!dept||r.dept===dept)); }
function weekTasks(dept){ const wk=weekKeys(), last=wk[6];
  return deptGoals(dept).flatMap(g=>tasksOf(g,dept)).filter(t=>t.due && t.due<=last && (!t.done || t.due>=wk[0])); }
function weekDonePct(dept){ const ts=weekTasks(dept); return ts.length?pct(ts):null; }
function focusPct(dept){ const wr=weekReports(dept); if(!wr.length) return null; return Math.round(wr.filter(r=>r.goalId).length/wr.length*100); }
function dormant(g,dept){ return !tasksOf(g,dept).some(t=>!t.done && t.due && ddayNum(t.due)<=7); }
function meetingTasks(dept){ return deptGoals(dept).flatMap(g=>tasksOf(g,dept).filter(t=>t.fromMeeting&&!t.done).map(t=>({g,t}))); }
function taskDept(g,t){ return isMulti(g)?t.dept:g.dept; }

/* ───────── 공통 UI ───────── */
let screen='dept', curDept=DEPT_LIST[0], toastTimer=null, lastHlGoal=null, repView='today';
const openFolds=new Set();
function toast(html){ const el=document.getElementById('toast'); el.innerHTML=html; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 2800); }
function go(s){ screen=s; editor={key:null}; if(s==='meet'&&!meetDept) meetDept=DEPT_LIST[0]; render(); window.scrollTo(0,0); }
function barHtml(p){ return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>'; }
function ddaySpan(due){ const n=ddayNum(due); return '<span class="mono dday '+(n<=1?'hot':'cool')+'">'+dday(due)+'</span>'; }
function pctOrDash(p){ return p==null?'–':p+'%'; }
function subPct(t){ return t.subs&&t.subs.length ? t.subs.filter(x=>x.done).length+'/'+t.subs.length : ''; }
function taskRow(g,t,canEdit,showDept){
  const subs=(t.subs||[]).filter(x=>!x.done), doneSubs=(t.subs||[]).filter(x=>x.done), open=openFolds.has(t.id), hasSubs=!!(t.subs&&t.subs.length), subsOpen=openFolds.has('subs:'+t.id)||editor.key==='sub:'+t.id+':new';

    +(canEdit?'<span class="acts"><button class="act" onclick="openEd(\'sub\',\''+g.id+'\',\''+t.id+'\')">+ 손자</button><button class="act" onclick="openEd(\'task\',\''+g.id+'\',\''+t.id+'\',true)">수정</button><button class="act danger" onclick="delTask(\''+g.id+'\',\''+t.id+'\')">삭제</button></span>':'')+'</div>'
    +'<span class="meta">'+(t.fromMeeting?'<span class="src">회의 결정</span>':'')
    +(t.due?ddaySpan(t.due)+'<span>'+esc(t.due.slice(5).replace('-','.'))+'</span>':'<span>마감 미정</span>')+'</span>'

    +(editor.key==='sub:'+t.id+':new'?edForm():'')

    +((hasSubs&&subsOpen)?'<div class="subs">'+subs.map(x=>subRow(g,t,x,canEdit)).join('')
      +(doneSubs.length?'<button class="fold" style="padding-left:0" onclick="toggleFold(\''+t.id+'\')">'+(open?'완료 '+doneSubs.length+'건 접기 ▲':'완료 '+doneSubs.length+'건 ▼')+'</button>'+(open?doneSubs.map(x=>subRow(g,t,x,canEdit)).join(''):''):'')+'</div>':'');
}
function subRow(g,t,x,canEdit){
  return '<div class="task'+(x.done?' done':'')+'">'
    +'<button class="cb" aria-label="완료 표시" '+(canEdit?'onclick="toggleSub(\''+g.id+'\',\''+t.id+'\',\''+x.id+'\')"':'disabled')+'>✓</button>'
    +'<div class="tt"><div class="ln"><b>'+esc(x.title)+'</b>'
    +(canEdit?'<span class="acts"><button class="act" onclick="openEd(\'sub\',\''+g.id+'\',\''+t.id+'\',\''+x.id+'\')">수정</button><button class="act danger" onclick="delSub(\''+g.id+'\',\''+t.id+'\',\''+x.id+'\')">삭제</button></span>':'')+'</div>'
    +'<span class="meta">'+(x.due?ddaySpan(x.due)+'<span>'+esc(x.due.slice(5).replace('-','.'))+'</span>':'<span>마감 미정</span>')+'</span>'
    +(editor.key==='sub:'+t.id+':'+x.id?edForm():'')+'</div></div>';
}
/* 세부업무 제목 클릭: 손자가 있으면 열고 닫기, 없으면 손자 추가 편집기 */
function toggleSubs(gid,tid){ const {t}=findTask(gid,tid); if(!t) return;
  if(t.subs&&t.subs.length){ const k='subs:'+tid; openFolds.has(k)?openFolds.delete(k):openFolds.add(k); render(); }
  else if(editor.key==='sub:'+tid+':new') closeEd();   /* 추가 편집기가 열려 있으면 제목 클릭으로 닫기 */
  else openEd('sub',gid,tid); }
function toggleFold(id){ openFolds.has(id)?openFolds.delete(id):openFolds.add(id); render(); }
/* 체크가 곧 보고: 완료하면 logs에 자동 기록, 되돌리면 그 기록도 삭제 */
function findTask(gid,tid){ const g=goalById(gid); return { g, t: g&&g.tasks.find(x=>x.id===tid) }; }
function logDone(g,item,dept){ const rep={ id:'r'+(++seq), date:TODAY, dept, who:HEAD[dept]||me.name, goalId:g.id, cat:null, text:'완료 · '+item.title, auto:true, taskId:item.id }; REPORTS.push(rep);
  api('taskDone',{ id:item.id, done:true, date:TODAY }).then(r=>{ if(LIVE&&r&&r.logId){ rep.id=r.logId; } }); }
function unlogDone(item){ const i=REPORTS.findIndex(r=>r.taskId===item.id); if(i>=0) REPORTS.splice(i,1); api('taskDone',{ id:item.id, done:false }); }
/* 체크가 곧 보고: 완료하면 logs에 자동 기록, 되돌리면 그 기록도 삭제 (손자도 동일) */
function toggleTask(gid,tid){
  const {g,t}=findTask(gid,tid); if(!t) return;
  t.done=!t.done; const dept=taskDept(g,t);
  if(t.done) logDone(g,t,dept); else unlogDone(t);
  render();
  if(t.done) toast('<b>'+esc(t.title)+'</b> 완료 · 오늘 보고에 자동 기록 · '+esc(g.title)+' '+pct(tasksOf(g,dept))+'%');
}
function toggleSub(gid,tid,sid){
  const {g,t}=findTask(gid,tid); const x=t&&t.subs.find(y=>y.id===sid); if(!x) return;
  x.done=!x.done; const dept=taskDept(g,t);
  if(x.done) logDone(g,x,dept); else unlogDone(x);
  render();
  if(x.done && t.subs.every(y=>y.done)) toast('<b>'+esc(t.title)+'</b> 손자 항목 전부 완료 · 세부업무도 체크할까요?');
  else if(x.done) toast('<b>'+esc(x.title)+'</b> 완료 · 오늘 보고에 자동 기록');
}

/* ───────── 추가 / 수정 / 삭제 (인라인 편집기 하나로 목표·세부업무·손자 공용) ───────── */
let editor={ key:null };
function openEd(type,gid,tid,sidOrEdit){
  if(type==='goal') editor={ key: gid?'goal:'+gid:'goal:new', type, gid, item: gid?goalById(gid):null, kind:null, depts:null, draft:{tasks:[]}, title:null, due:null };
  else if(type==='task') editor={ key: sidOrEdit?'task:'+tid:'task:'+gid+':new', type, gid, tid, item: sidOrEdit?findTask(gid,tid).t:null };
  else { const {t}=findTask(gid,tid); const x=sidOrEdit&&t.subs?t.subs.find(y=>y.id===sidOrEdit):null; editor={ key:'sub:'+tid+':'+(x?x.id:'new'), type, gid, tid, item:x }; }
  render(); const el=document.getElementById('edTitle'); if(el) el.focus();
}
function closeEd(){ editor={ key:null }; render(); }
function goalForm(){
  const it=editor.item||{}; const kind=editor.kind||it.kind||(screen==='hq'?'통합':'월간');
  const kinds = screen==='hq' ? KINDS : KINDS.filter(k=>k[0]==='월간');   // 부장: 전부 · 과장: 자기 과 월간만

  return '<div class="gform" onclick="event.stopPropagation()">'

    +'<div class="lb">제목</div><input type="text" id="edTitle" value="'+esc(it.title||'')+'" placeholder="'+(kind==='통합'?'예) 추석 연합행사':kind==='외부'?'예) 총회 영상 자료 제출':'예) 9월 기획PPT 시리즈 제작')+'" onkeydown="if(event.key===\'Enter\')saveEd();if(event.key===\'Escape\')closeEd()">'
    +(kind==='월간'
      ?'<div class="lb">담당 과</div><select id="edDept">'+DEPT_LIST.map(dn=>'<option'+(dn===(it.dept||curDept)?' selected':'')+'>'+dn+'</option>').join('')+'</select>'
      :'<div class="lb">참여 과 · 여러 개 선택</div><div class="dch">'+DEPT_LIST.map(dn=>'<label><input type="checkbox" class="edDepts" value="'+dn+'"'+(sel.includes(dn)?' checked':'')+' onchange="editor.depts=[...document.querySelectorAll(\'.edDepts:checked\')].map(x=>x.value)"><span class="dot" style="background:'+DEPTS[dn].color+'"></span>'+dn+'</label>').join('')+'</div>')
    +'<div class="lb">마감</div><input type="date" id="edDue" value="'+(it.due||'')+'" style="width:160px">'
    +(it.id?'':draftHtml(kind, kind==='월간'?[]:sel))
    +'<div class="acts2"><button class="btn pri" onclick="saveEd()">'+(it.id?'저장':'등록')+'</button><button class="btn ghost" onclick="closeEd()">취소</button></div>'
    +'<div class="err" id="edErr">제목과 참여 과를 확인해주세요.</div></div>';
}
/* 목표 등록 폼 안의 세부업무·손자 초안 (editor.draft) */
function draftHtml(kind, depts){
  const d=editor.draft||(editor.draft={tasks:[]}); const multi=kind!=='월간'; const dopts=(multi&&depts.length)?depts:DEPT_LIST;
  const rows=d.tasks.map((t,i)=>'<div class="drow'+(multi?' multi':'')+'" data-ti="'+i+'">'
      +(multi?'<select class="dt-dept" style="width:100%">'+dopts.map(dn=>'<option'+(dn===t.dept?' selected':'')+'>'+dn+'</option>').join('')+'</select>':'')
      +'<input type="text" class="dt-title" placeholder="세부업무 '+(i+1)+'" value="'+esc(t.title||'')+'"><input type="date" class="dt-due" value="'+(t.due||'')+'">'
      +'<button class="plus" onclick="draftAddSub('+i+')">+ 손자</button><button class="x" onclick="draftRemove('+i+')" aria-label="삭제">✕</button></div>'
    +(t.subs||[]).map((x,j)=>'<div class="drow sub" data-ti="'+i+'" data-si="'+j+'"><input type="text" class="ds-title" placeholder="손자 항목" value="'+esc(x.title||'')+'"><input type="date" class="ds-due" value="'+(x.due||'')+'"><button class="x" onclick="draftRemove('+i+','+j+')" aria-label="삭제">✕</button></div>').join('')
  ).join('');
  return '<div class="lb">세부업무 · 손자 <span style="font-weight:400;text-transform:none;letter-spacing:0">(선택 · 나중에 추가해도 됨)</span></div>'+rows
    +'<button class="addrow" onclick="draftAddTask()">+ 세부업무</button>';
}
function collectDraft(){
  const d=editor.draft||(editor.draft={tasks:[]});
  document.querySelectorAll('.drow[data-ti]:not(.sub)').forEach(r=>{ const t=d.tasks[+r.dataset.ti]; if(!t) return;
    t.title=r.querySelector('.dt-title').value.trim(); t.due=r.querySelector('.dt-due').value||null; const sel=r.querySelector('.dt-dept'); if(sel) t.dept=sel.value; });
  document.querySelectorAll('.drow.sub').forEach(r=>{ const x=(d.tasks[+r.dataset.ti]||{subs:[]}).subs[+r.dataset.si]; if(!x) return;
    x.title=r.querySelector('.ds-title').value.trim(); x.due=r.querySelector('.ds-due').value||null; });
  editor.title=(document.getElementById('edTitle')||{}).value; editor.due=(document.getElementById('edDue')||{}).value;
  return d;
}
function draftRender(){ render(); const t=document.getElementById('edTitle'); if(t&&editor.title!=null) t.value=editor.title; const du=document.getElementById('edDue'); if(du&&editor.due!=null) du.value=editor.due; }
function draftAddTask(){ collectDraft(); editor.draft.tasks.push({title:'',due:'',dept:(editor.depts||[])[0]||curDept,subs:[]}); draftRender(); const rs=document.querySelectorAll('.dt-title'); if(rs.length) rs[rs.length-1].focus(); }
function draftAddSub(i){ collectDraft(); (editor.draft.tasks[i].subs=editor.draft.tasks[i].subs||[]).push({title:'',due:''}); draftRender(); }
function draftRemove(i,j){ collectDraft(); if(j==null) editor.draft.tasks.splice(i,1); else editor.draft.tasks[i].subs.splice(j,1); draftRender(); }
/* 새 목표 + 세부업무 + 손자를 순서대로 서버에 저장 (goal id → task id → sub) */
function persistNewGoal(g){
  if(!LIVE) return;
  const chain = api('goalSave',{ kind:g.kind, dept:g.dept, depts:g.depts||[], title:g.title, due:g.due }).then(r=>{ g.id=r.id; });
  g.tasks.reduce((pr,t)=>pr.then(()=>api('taskSave',{ goalId:g.id, dept:t.dept||g.dept, title:t.title, due:t.due }).then(r=>{ t.id=r.id; })
    .then(()=>(t.subs||[]).reduce((p2,x)=>p2.then(()=>api('taskSave',{ goalId:g.id, parentId:t.id, title:x.title, due:x.due }).then(r=>{ x.id=r.id; })), Promise.resolve()))), chain)
    .then(()=>{ render(); toast('<b>'+esc(g.title)+'</b> 저장 완료'); });
}
function edForm(){
  const it=editor.item||{}, isGoal=editor.type==='goal';
  if(isGoal) return goalForm();

  const needDept = screen==='hq' && !editor.item && editor.type==='task' && g && isMulti(g);

    +(needDept?'<select id="edDept" aria-label="담당 과">'+dopts.map(dn=>'<option'+(dn===curDept?' selected':'')+'>'+dn+'</option>').join('')+'</select>':'')
    +'<input type="text" id="edTitle" value="'+esc(it.title||'')+'" placeholder="'+(isGoal?'목표 제목':editor.type==='task'?'세부업무 제목':'손자 항목 제목')+'" onkeydown="if(event.key===\'Enter\')saveEd();if(event.key===\'Escape\')closeEd()">'
    +'<input type="date" id="edDue" value="'+(it.due||(isGoal?'':nextSat()))+'" aria-label="마감">'
    +'<button class="btn pri" onclick="saveEd()">'+(editor.item?'저장':'추가')+'</button><button class="btn ghost" onclick="closeEd()">취소</button></div>';
}
function saveEd(){
  const title=(document.getElementById('edTitle')||{}).value.trim(), due=(document.getElementById('edDue')||{}).value||null;
  if(!title){ document.getElementById('edTitle').focus(); return; }
  const dept=(document.getElementById('edDept')||{}).value||curDept;
  if(editor.type==='goal'){
    const kind=editor.item?editor.item.kind:(editor.kind||(screen==='hq'?'통합':'월간'));
    const depts=[...document.querySelectorAll('.edDepts:checked')].map(x=>x.value);
    if(kind!=='월간' && !depts.length){ const e=document.getElementById('edErr'); if(e) e.style.display='block'; return; }
    if(editor.item){ editor.item.title=title; editor.item.due=due; if(kind!=='월간') editor.item.depts=depts; else editor.item.dept=dept;
      api('goalSave',{ id:editor.item.id, kind, dept:editor.item.dept, depts:editor.item.depts||[], title, due }); }
    else {
      const d=collectDraft(); const gd = kind==='월간'?[dept]:depts;
      const tasks=d.tasks.filter(t=>t.title).map(t=>({ id:'t'+(++seq), title:t.title, due:t.due||null, done:false, dept: kind==='월간'?undefined:(gd.includes(t.dept)?t.dept:gd[0]),
        subs:(t.subs||[]).filter(x=>x.title).map(x=>({ id:'s'+(++seq), title:x.title, due:x.due||null, done:false })) }));
      const g={ id:'g'+(++seq), kind, dept: kind==='월간'?dept:null, depts: kind==='월간'?undefined:depts, title, due, tasks }; GOALS.push(g); persistNewGoal(g); }
  } else if(editor.type==='task'){
    const g=goalById(editor.gid);
    if(editor.item){ editor.item.title=title; editor.item.due=due; api('taskSave',{ id:editor.item.id, goalId:g.id, title, due }); }
    else { const t={ id:'t'+(++seq), title, due, done:false, subs:[] }; if(isMulti(g)) t.dept=goalDepts(g).includes(dept)?dept:goalDepts(g)[0]; g.tasks.push(t); sync('taskSave',{ goalId:g.id, dept:t.dept||g.dept, title, due }, t); }
  } else {
    const {t}=findTask(editor.gid,editor.tid); t.subs=t.subs||[];
    if(editor.item){ editor.item.title=title; editor.item.due=due; api('taskSave',{ id:editor.item.id, goalId:editor.gid, parentId:t.id, title, due }); }
    else { const x={ id:'s'+(++seq), title, due, done:false }; t.subs.push(x); openFolds.add('subs:'+t.id); sync('taskSave',{ goalId:editor.gid, parentId:t.id, title, due }, x); }
  }
  const msg=editor.item?'수정됨':'추가됨'; editor={ key:null }; render(); toast('<b>'+esc(title)+'</b> '+msg);
}
function delGoal(gid){ const g=goalById(gid); if(!g) return; if(!confirm('"'+g.title+'" 목표와 세부업무 '+g.tasks.length+'건을 삭제할까요?')) return; GOALS.splice(GOALS.indexOf(g),1); api('goalDelete',{id:gid}); render(); toast('삭제됨'); }

/* ───────── 카드 1: 보고 (입력 + 오늘/이번 주) ───────── */
const TABS=[['통합','통합목표'],['월간','월간목표'],['외부','외부지시'],['상시','상시업무']];
function tabItems(dept,kind){ if(kind==='상시') return (dept===BOSS?BOSS_CATS:DEPTS[dept].cats).map(c=>({v:'c:'+c,label:c}));
  return deptGoals(dept).filter(g=>g.kind===kind).map(g=>({v:'g:'+g.id,label:g.title})); }
function defaultTab(dept){ const gs=deptGoals(dept).map(g=>({g,due:Math.min.apply(null,tasksOf(g,dept).filter(t=>!t.done&&t.due).map(t=>ddayNum(t.due)).concat([999]))})).sort((a,b)=>a.due-b.due)[0];
  return gs&&gs.due<999?gs.g.kind:'상시'; }
function goalOptions(dept, withCats){
  const kind=defaultTab(dept); const first=tabItems(dept,kind)[0]; const def=first?first.v:'';
  return (withCats?TABS:KINDS).map(k=>{ const list=tabItems(dept,k[0]); return list.length?'<optgroup label="'+k[1]+'">'+list.map(i=>'<option value="'+i.v+'"'+(i.v===def?' selected':'')+'>'+esc(i.label)+'</option>').join('')+'</optgroup>':''; }).join(''); }
function reportCard(dept, mine){

    body = tr.map(r=>repRow(r,mine)).join('') || '<div class="hint" style="margin:6px 0 0">'+(mine?'아직 없습니다. 한 줄 쓰거나, 아래 목표에서 세부업무를 체크하면 여기에 쌓입니다.':'오늘 보고가 아직 없습니다.')+'</div>';
  } else {

        +(rs.length?rs.map(r=>{ const g=r.goalId&&goalById(r.goalId); return '<span class="wdi" '+kindStyle(g?g.kind:'상시')+' title="'+esc(g?g.title:r.cat)+'"><i></i>'+esc(r.text)+'</span>'; }).join('')
        :'<span class="wdi none">'+(future?'예정':'—')+'</span>')+'</span></div>'; }).join('')+'</div>';

    +form

function delReport(id){ const i=REPORTS.findIndex(r=>r.id===id); if(i>=0) REPORTS.splice(i,1); api('logDelete',{id}); render(); }

/* ───────── 카드 2: 목표 (통합 / 월간 / 외부 한 카드) ───────── */
const KIND_LABEL={통합:'통합목표',월간:'월간목표',외부:'외부지시',상시:'상시업무'};
function kindStyle(k){ return 'style="--kc:var(--k-'+k+');--kb:var(--k-'+k+'-bg)"'; }
function goalBlock(g,dept,canEdit){
  const ts=tasksOf(g,dept), done=ts.filter(t=>t.done);
  const acts = canEdit ? '<span class="acts"><button class="act" onclick="openEd(\'task\',\''+g.id+'\')">+ 세부업무</button><button class="act" onclick="openEd(\'goal\',\''+g.id+'\')">수정</button>'
    +(g.done?'<button class="act" onclick="doneGoal(\''+g.id+'\',true)">다시 진행</button>':'<button class="act" onclick="doneGoal(\''+g.id+'\')">완료</button>')
    +'<button class="act danger" onclick="delGoal(\''+g.id+'\')">삭제</button></span>' : '';
  const all=!dept, parts=all&&isMulti(g)?goalDepts(g):[];
  const folded=openFolds.has('gfold:'+g.id) && !(editor.key&&editor.key.indexOf(g.id)>=0);
  const deptBars = parts.length ? '<div class="int-depts" style="grid-template-columns:repeat('+parts.length+',1fr)">'+parts.map(dn=>'<div class="int-d">'+barHtml(pct(tasksOf(g,dn)))+dn.slice(0,2)+' '+pct(tasksOf(g,dn))+'%</div>').join('')+'</div>' : '';

    +'<div class="gh"><span class="kind"><i></i>'+KIND_LABEL[g.kind]+(isMulti(g)?' · '+goalDepts(g).length+'개 과':'')+'</span><b class="gt" onclick="toggleFold(\'gfold:'+g.id+'\')" title="세부업무 접기/펼치기">'+esc(g.title)
    +(folded?' <span class="mono" style="font-size:11px;color:var(--faint);font-weight:700">▸ 세부업무 '+ts.length+(done.length?' · 완료 '+done.length:'')+'</span>':'')+'</b>'
    +(!g.done&&dormant(g,dept)?'<span class="badge dorm">휴면</span>':'')+(g.due?ddaySpan(g.due):'')+'<span class="pct mono">'+pct(ts)+'%</span>'+acts+'</div>'
    +(editor.key==='goal:'+g.id?edForm():'')
    +barHtml(pct(ts))
    +(all&&isMulti(g)?'<div class="pdepts">'+goalDepts(g).map(dn=>'<span class="pd"><i class="dot" style="background:'+DEPTS[dn].color+'"></i>'+dn+'</span>').join('')+'</div>':'')
    +deptBars

    +(!ts.length&&!editor.key?'<div class="hint" style="margin:6px 0 4px">세부업무가 없습니다. 이번 주 할 일을 하나 정해주세요.</div>':'')+'</div>')

function goalsCard(dept, canEdit){

  const legend=KINDS.filter(k=>gs.some(g=>g.kind===k[0])).map(k=>'<span class="kind" '+kindStyle(k[0])+'><i></i>'+k[1]+' '+gs.filter(g=>g.kind===k[0]).length+'</span>').join(' ');

    +'<h2>목표<span style="display:flex;align-items:center;gap:8px"><span class="sub mono">이번 주 세부업무 '+wt.filter(t=>t.done).length+'/'+wt.length+(mt.length?' · 회의 결정 '+mt.length:'')+'</span>'
    +(canEdit?'<button class="addgoal" onclick="openEd(\'goal\')">+ 목표</button>':'')+'</span></h2>'

/* 상시업무: 목표 카드 맨 아래 한 줄. 세부업무·진행률 없이 이번 주 건수만 */
function routineLine(dept){
  const rs=weekReports(dept).filter(r=>!r.goalId); const by={}; rs.forEach(r=>{ by[r.cat]=(by[r.cat]||0)+1; });
  const detail=Object.keys(by).sort((a,b)=>by[b]-by[a]).map(c=>esc(c)+' '+by[c]).join(' · ');
  return '<div class="goal" '+kindStyle('상시')+' style="--kc:var(--k-상시);--kb:var(--k-상시-bg);padding-bottom:2px"><div class="gh"><span class="kind"><i></i>상시업무</span>'
    +'<b style="font-weight:500;color:var(--dim);font-size:12.5px">이번 주 '+rs.length+'건'+(detail?' ('+detail+')':'')+'</b></div></div>';
}

  const legend=[['통합',ints.length],['외부',exts.length],['월간',GOALS.filter(g=>!g.done&&g.kind==='월간').length]].filter(x=>x[1]).map(x=>'<span class="kind" '+kindStyle(x[0])+'><i></i>'+KIND_LABEL[x[0]]+' '+x[1]+'</span>').join(' ');
  const kindSec=(k,list)=>{ const open=openFolds.has('hqk:'+k);
    return '<button class="dsec ksec" style="--kc:var(--k-'+k+');--kb:var(--k-'+k+'-bg)" onclick="toggleFold(\'hqk:'+k+'\')"><span class="dot" style="background:var(--kc)"></span><b>'+KIND_LABEL[k]+'</b><span class="hq-sub">'+list.length+'개</span><span style="margin-left:auto;color:var(--faint)">'+(open?'▾':'▸')+'</span></button>'

function buildReport(month){
  const logs=REPORTS.filter(r=>String(r.date||'').slice(0,7)===month);
  const inMonth=d=>String(d||'').slice(0,7)===month;
  const goalActive=g=>!g.done || logs.some(r=>r.goalId===g.id) || g.tasks.some(t=>inMonth(t.due)||(t.subs||[]).some(x=>inMonth(x.due)));
  const dedupe=list=>{ const m=new Map(); list.forEach(r=>{ const k=r.text.trim(); const e=m.get(k)||{text:k,n:0,who:new Set()}; e.n++; e.who.add(r.who); m.set(k,e); }); return [...m.values()]; };
  const goalBlock=g=>({ g, tasks:g.tasks.map(t=>({t,subs:t.subs||[]})),
    acts:dedupe(logs.filter(r=>r.goalId===g.id && !r.auto)) });
  const depts=DEPT_LIST.map(dn=>{
    const dl=logs.filter(r=>r.dept===dn);
    const monthly=GOALS.filter(g=>g.kind==='월간'&&g.dept===dn&&goalActive(g)).map(goalBlock);
    const routineMap={}; dl.filter(r=>!r.goalId).forEach(r=>{ routineMap[r.cat]=(routineMap[r.cat]||0)+1; });
    return { dn, logs:dl, days:new Set(dl.map(r=>r.date)).size, monthly, routine:Object.entries(routineMap).sort((a,b)=>b[1]-a[1]) };
  });
  const allTasks=GOALS.filter(goalActive).flatMap(g=>g.tasks.flatMap(t=>[t,...(t.subs||[])]));
  return {
    month, logs, days:new Set(logs.map(r=>r.date)).size,
    taskDone:allTasks.filter(t=>t.done).length, taskAll:allTasks.length,
    focus: logs.length?Math.round(logs.filter(r=>r.goalId).length/logs.length*100):null,
    integrated:GOALS.filter(g=>g.kind==='통합'&&goalActive(g)).map(goalBlock),
    external:GOALS.filter(g=>g.kind==='외부'&&goalActive(g)).map(goalBlock),
    depts,
    carry:allTasks.filter(t=>!t.done)
  };
}

  const pseen=new Set(); const products=R.logs.filter(r=>/제작/.test(r.cat||'')).map(r=>String(r.text).trim()).filter(t=>t&&!pseen.has(t)&&pseen.add(t));
  const nextPlan=GOALS.filter(g=>!g.done).map(g=>g.title);
  return { month, carry: prev? n(prev.carry)+n(prev.income)-n(prev.expense) : (saved?n(saved.carry):0), income:0, expense:0, deposit: prev?n(prev.deposit):(saved?n(saved.deposit):0),
    activities:acts.join('\n'), products:products.join('\n'), nextPlan:nextPlan.join('\n') };
}
function wordSet(k,v){ rpDraft[k]=(k==='activities'||k==='products'||k==='nextPlan')?v:(Number(String(v).replace(/[^\d.-]/g,''))||0); if(k!=='activities'&&k!=='products'&&k!=='nextPlan'){ const b=rpDraft.carry+rpDraft.income-rpDraft.expense; document.getElementById('rpBal').textContent=b.toLocaleString(); document.getElementById('rpTot').textContent=(b+rpDraft.deposit).toLocaleString(); } }
function renderWordForm(){
  const D=rpDraft, [y,m]=repMonth.split('-'), bal=D.carry+D.income-D.expense;
  const ta=(k,label,rows)=>'<div class="lb">'+label+'</div><textarea rows="'+rows+'" oninput="wordSet(\''+k+'\',this.value)" placeholder="한 줄에 하나">'+esc(D[k])+'</textarea>';
  const num=(k,label)=>'<label><small>'+label+'</small><input type="text" inputmode="numeric" value="'+D[k].toLocaleString()+'" oninput="wordSet(\''+k+'\',this.value)" onblur="this.value=rpDraft.'+k+'.toLocaleString()"></label>';
  return '<div class="card rp-word"><div class="kicker">Word</div><h2>월말보고서 · '+y+'년 '+Number(m)+'월분<span style="font-size:12px;font-weight:600;color:var(--faint)">신천기 '+(Number(y)-1983)+'년</span></h2>'
    +ta('activities','1. 활동내용',8)
    +'<div class="lb">2. 재정현황 <span style="font-weight:600;color:var(--faint)">(원)</span></div><div class="rp-fin">'+num('carry','전월이월금')+num('income','월입금')+num('expense','월출금')+num('deposit','정기예금')+'</div>'
    +'<div class="rp-sum"><span>월잔액 <b id="rpBal">'+bal.toLocaleString()+'</b></span><span>회계잔금 <b id="rpTot">'+(bal+D.deposit).toLocaleString()+'</b></span></div>'
    +ta('products','3. 제작물현황',3)+ta('nextPlan','4. 차월계획',3)
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center"><button class="btn pri" id="rpWordBtn" onclick="makeWord()">Word 만들기</button><button class="btn ghost" onclick="rpDraft=wordDraft(repMonth,true);render()">기록으로 초안 다시</button>'
    +'</div><div class="hint">이 화면에서 바로 .docx 파일이 내려받아집니다. 입력한 내용은 시트에 남아 다음 달 이월금과 재편집에 쓰입니다.</div></div>';
}
async function makeWord(){
  const b=document.getElementById('rpWordBtn'); b.disabled=true; b.textContent='만드는 중…';
  const name='문화부_월말보고서_'+repMonth+'.docx';
  try{
    await loadDocx();
    const b64=await docx.Packer.toBase64String(wordDocx(rpDraft, repMonth));
    const a=document.createElement('a'); a.href='data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,'+b64; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    const rec=Object.assign({id:repMonth}, rpDraft); const i=MONTHLY.findIndex(x=>x.id===repMonth); if(i>=0) MONTHLY[i]=rec; else MONTHLY.push(rec);
    api('monthSave', Object.assign({month:repMonth}, rpDraft)).catch(()=>{});   // 입력값 기록 (다음 달 이월금)
    toast('<b>'+esc(name)+'</b> 내려받음');
  }catch(e){ toast('실패 · '+esc(e.message||e)); }
  render();
}
function copyReport(){ const text=reportText(); const done=()=>toast('<b>월간 보고서</b> 복사됨 · 문서에 붙여넣기');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>{ prompt('복사해서 쓰세요', text); });
  else prompt('복사해서 쓰세요', text); }

/* ───────── 루트 ───────── */

/* ───────── 캘린더: 생일(members.birthday) + 과 일정(events) + 마감(goals/actions) ───────── */
let calYM = TODAY.slice(0,7), calSel=null, calFrom='dept';
function toggleCal(){ if(screen==='cal') go(calFrom); else { calFrom=screen; calSel=null; go('cal'); } }
function calMove(n){ const [y,m]=calYM.split('-').map(Number); const t=new Date(y,m-1+n,1); calYM=iso(t).slice(0,7); calSel=null; render(); }
const GREY='#A9B0BB';
function dayItems(ds, dept){   // dept 지정 시 그 과 관련만
  const out=[];
  PEOPLE.filter(p=>p.birthday===ds.slice(5)).forEach(p=>out.push({ k:'birth', color:'#F2B84B', text:'🎂 '+p.name+' 생일', sub:p.dept }));
  EVENTS.filter(e=>e.date===ds && (!dept || !e.dept || e.dept===dept)).forEach(e=>out.push({ k:'event', id:e.id, dept:e.dept, color:e.dept?DEPTS[e.dept].color:GREY, text:e.title, sub:e.dept||'문화부 전체' }));
  GOALS.filter(g=>!g.done && (!dept||goalDepts(g).includes(dept))).forEach(g=>{
    if(g.due===ds) out.push({ k:'due', color:GREY, text:'마감 · '+g.title, sub:g.kind+'목표' });
    g.tasks.forEach(t=>{ if(dept && t.dept && t.dept!==dept) return;
      if(!t.done && t.due===ds) out.push({ k:'due', color:GREY, text:'마감 · '+t.title, sub:g.title });
      (t.subs||[]).forEach(x=>{ if(!x.done && x.due===ds) out.push({ k:'due', color:GREY, text:'마감 · '+x.title, sub:t.title }); }); });
  });
  return out;
}
function itemLi(it, ds){
  const canDel = it.k==='event' && (isBoss() || (it.dept && it.dept===me.dept));
  return '<li><span class="dt">'+fmtShort(ds).slice(0,-4)+'</span><i class="dot" style="background:'+it.color+'"></i><span>'+esc(it.text)+' '+(it.sub?'<span style="color:var(--faint);font-weight:400">· '+esc(it.sub)+'</span>':'')+'</span>'
    +(canDel?'<button class="x" onclick="delEvent(\''+it.id+'\')">삭제</button>':'')+'</li>';
}
function dayLine(ds, dept, label){   // 한 줄 요약 (일일보고 위 · 회의)
  const items=dayItems(ds, dept).filter(it=>it.k!=='due'); if(!items.length) return '';
  return '<div class="dayline"><b style="color:var(--ink)">'+label+'</b>'+items.map(it=>'<span><i class="dot" style="background:'+it.color+'"></i>'+esc(it.text)+'</span>').join('')+'</div>';
}
function weekLine(dept){   // 다음 주 월~일
  const dow=new Date(TODAY+'T00:00:00').getDay(), mon=((1-dow)+7)%7||7; let out=[];
  for(let i=0;i<7;i++){ const ds=d(mon+i); dayItems(ds,dept).filter(it=>it.k!=='due').forEach(it=>out.push('<span><i class="dot" style="background:'+it.color+'"></i>'+fmtShort(ds).slice(0,-4)+' '+esc(it.text)+'</span>')); }
  return out.length ? '<div class="dayline"><b style="color:var(--ink)">다음 주 일정</b>'+out.join('')+'</div>' : '';
}
function addEvent(){
  const title=document.getElementById('evTitle').value.trim(), date=document.getElementById('evDate').value, dept=document.getElementById('evDept').value;
  if(!title||!date){ toast('제목과 날짜를 입력하세요'); return; }
  const e={ id:'x'+(++seq), dept, title, date }; EVENTS.push(e); calYM=date.slice(0,7); calSel=date; render();
  sync('eventSave',{ title, date, dept }, e);
}
function delEvent(id){ EVENTS=EVENTS.filter(e=>e.id!==id); render(); api('eventDelete',{ id }); }
function renderCal(){
  const [y,m]=calYM.split('-').map(Number); const first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  let cells=['일','월','화','수','목','금','토'].map(w=>'<div class="cwd">'+w+'</div>').join(''), month=[];
  for(let i=0;i<first;i++) cells+='<div class="d empty"></div>';
  for(let n=1;n<=days;n++){ const ds=calYM+'-'+String(n).padStart(2,'0'), items=dayItems(ds);
    items.filter(it=>it.k!=='due').forEach(it=>month.push([ds,it]));   // 달 목록엔 생일·일정만, 마감은 날짜 선택 시
    cells+='<div class="d'+(ds===TODAY?' today':'')+((first+n-1)%7===0?' sun':'')+(ds===calSel?' sel':'')+'" onclick="calSel=calSel===\''+ds+'\'?null:\''+ds+'\';render()">'+n
      +'<div class="dots">'+items.slice(0,3).map(it=>'<i style="background:'+(ds===TODAY?'var(--accent-ink)':it.color)+'"></i>').join('')+'</div></div>'; }
  const list = calSel ? dayItems(calSel).map(it=>itemLi(it,calSel)) : month.map(([ds,it])=>itemLi(it,ds));
  const deptOpts = (isBoss()?['']:[]).concat(isBoss()?DEPT_LIST:[me.dept]).map(dn=>'<option value="'+dn+'">'+(dn||'문화부 전체')+'</option>').join('');
  return '<div class="card"><div class="kicker">Calendar</div>'
    +'<div class="calnav"><button onclick="calMove(-1)">‹</button><h2 style="margin:0">'+y+'년 '+m+'월</h2><button onclick="calMove(1)">›</button></div>'
    +'<div class="cal">'+cells+'</div>'
    +'<div class="hint">🟡 생일 · 과 색 = 과 일정 · 회색 = 마감 · 날짜를 누르면 그날만 봅니다</div>'
    +'<ul class="evl">'+(list.length?list.join(''):'<li style="color:var(--faint)">'+(calSel?fmtMD(calSel)+' 일정 없음':'이번 달 생일·일정 없음')+'</li>')+'</ul>'
    +'<div class="form" style="margin-top:12px"><div class="frow" style="grid-template-columns:1fr"><input type="text" id="evTitle" placeholder="새 일정 · 행사, 촬영, 리허설…"></div>'
    +'<div class="frow" style="grid-template-columns:1fr 1fr auto"><input type="date" id="evDate" value="'+(calSel||TODAY)+'"><select id="evDept">'+deptOpts+'</select><button class="btn pri" onclick="addEvent()">추가</button></div></div>'
    +'</div>';
}
function render(){
  if(!me) return;
  document.getElementById('userchip').innerHTML = '<b>'+esc(me.name)+'</b><span class="g"><i></i>'+esc(me.dept)+'</span>'
    +(LIVE?'<button class="sw" onclick="logout()" style="background:var(--track);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--dim)">전환</button>'
          :'<select aria-label="시안용 계정 전환" onchange="switchUser(this.value)">'+USERS.map(u=>'<option'+(u.name===me.name?' selected':'')+'>'+u.name+'</option>').join('')+'</select>');
  const tabs = isBoss() ? [['dept','과 운영'],['hq','부 운영'],['meet','회의'],['report','보고서']] : [['dept','우리 과']];
  document.getElementById('seg').innerHTML=tabs.map(t=>'<button class="'+(screen===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  if(!isBoss()) curDept = me.dept;
  if(!isBoss() && screen!=='cal') screen='dept';
  document.getElementById('calBtn').className='hbtn'+(screen==='cal'?' on':'');
  document.getElementById('app').innerHTML = screen==='hq' ? renderHQ() : screen==='meet' ? renderMeet() : screen==='report' ? renderReport() : screen==='cal' ? renderCal() : renderDept();
  lastHlGoal=null;
}
boot();
</script>
